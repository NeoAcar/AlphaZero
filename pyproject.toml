[project]
name = "alphazero-chess"
version = "0.1.0"
description = "AlphaZero implementation for chess (MCTS + ResNet)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "python-chess>=1.11",
    "numpy>=2.0",
    "torch>=2.5",
    "tqdm>=4.66",
    "wandb>=0.18",
    "flask>=3.0",
    "matplotlib>=3.11.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
